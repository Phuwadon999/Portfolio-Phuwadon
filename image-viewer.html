<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030712;
        --text: #f8fafc;
        --muted: #cbd5e1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #020617, #111827 70%, #030712);
      }

      .viewer {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .viewer-card {
        width: min(1200px, 100%);
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 24px;
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        backdrop-filter: blur(16px);
      }

      .viewer-toolbar {
        position: relative;
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 6, 23, 0.6);
      }

      .viewer-toolbar button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
        font: inherit;
      }

      .viewer-toolbar span {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: var(--muted);
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .viewer-image-wrap {
        padding: 18px;
        display: grid;
        place-items: center;
      }

      .viewer-image-wrap img {
        max-width: 100%;
        max-height: min(80vh, 860px);
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 18px;
      }

      .viewer-caption {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 0 20px 20px;
        color: var(--muted);
        text-align: center;
        font-size: 1rem;
        line-height: 1.6;
      }

      .viewer-caption--image {
        margin-top: 8px;
        color: var(--text);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="viewer">
      <div class="viewer-card">
        <div class="viewer-toolbar">
          <button id="backBtn" type="button">← กลับ</button>
          <span id="caption">ภาพ</span>
        </div>
        <div class="viewer-image-wrap">
          <img id="viewerImage" alt="" />
        </div>
        <div class="viewer-caption">กดปุ่มกลับหรือกด Esc เพื่อย้อนกลับหน้าเดิม</div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src') || '';
      const caption = params.get('caption') || '';
      const image = document.getElementById('viewerImage');
      const captionEl = document.getElementById('caption');
      const backBtn = document.getElementById('backBtn');
      const viewer = document.querySelector('.viewer');

      if (src) {
        image.src = src;
        image.alt = caption || 'ภาพขยาย';
      }

      captionEl.textContent = caption || 'ภาพ';

      const goBack = () => {
        window.history.back();
      };

      backBtn.addEventListener('click', goBack);
      viewer.addEventListener('click', (event) => {
        if (event.target === viewer) {
          goBack();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          goBack();
        }
      });
    </script>
  </body>
</html>
